name: Publish Development Dependencies Chart (latest)

on:
  push:
    branches: [main]
    paths:
      - charts/kubernaut-development-dependencies/**
      - hack/verify-development-dependencies-chart.sh
      - .github/workflows/publish-development-dependencies.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Merged source ref to package
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: publish-development-dependencies
  cancel-in-progress: false

env:
  CHART_REPOSITORY: quay.io/kubernaut-ai/kubernaut-development-dependencies

jobs:
  publish:
    name: Publish development dependencies OCI chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install pinned Helm 4
        run: |
          set -euo pipefail
          HELM_VERSION=v4.3.0
          HELM_ARCHIVE="/tmp/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "${HELM_ARCHIVE}"
          printf '%s  %s\n' \
            86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb \
            "${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${HELM_ARCHIVE}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate and package chart
        run: |
          set -euo pipefail
          helm lint charts/kubernaut-development-dependencies
          HELM_BIN=helm ./hack/verify-development-dependencies-chart.sh
          # This chart owns its own internal version cadence; it is deliberately
          # independent from the operator's release/tag version.
          base_version=$(awk '$1 == "version:" {print $2; exit}' charts/kubernaut-development-dependencies/Chart.yaml)
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          export CHART_VERSION="${base_version}-run.${GITHUB_RUN_NUMBER}"
          export CHART_REGISTRY_VERSION="${CHART_VERSION//+/_}"
          {
            echo "SOURCE_SHA=${SOURCE_SHA}"
            echo "CHART_VERSION=${CHART_VERSION}"
            echo "CHART_REGISTRY_VERSION=${CHART_REGISTRY_VERSION}"
          } >> "${GITHUB_ENV}"
          mkdir -p dist
          helm package charts/kubernaut-development-dependencies \
            --version "${CHART_VERSION}" \
            --app-version "${SOURCE_SHA}" \
            --destination dist

      - name: Login to Quay.io
        env:
          QUAY_DEVELOPMENT_DEPENDENCIES_USERNAME: ${{ secrets.QUAY_DEVELOPMENT_DEPENDENCIES_USERNAME }}
          QUAY_DEVELOPMENT_DEPENDENCIES_TOKEN: ${{ secrets.QUAY_DEVELOPMENT_DEPENDENCIES_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${QUAY_DEVELOPMENT_DEPENDENCIES_TOKEN}" | helm registry login quay.io \
            --username "${QUAY_DEVELOPMENT_DEPENDENCIES_USERNAME}" \
            --password-stdin
          printf '%s' "${QUAY_DEVELOPMENT_DEPENDENCIES_TOKEN}" | skopeo login quay.io \
            --username "${QUAY_DEVELOPMENT_DEPENDENCIES_USERNAME}" \
            --password-stdin

      - name: Push immutable chart version and latest alias
        id: push
        run: |
          set -euo pipefail
          package="dist/kubernaut-development-dependencies-${CHART_VERSION}.tgz"
          if skopeo inspect --raw "docker://${CHART_REPOSITORY}:${CHART_REGISTRY_VERSION}" >/dev/null 2>&1; then
            echo "Refusing to replace existing immutable chart tag ${CHART_REGISTRY_VERSION}" >&2
            exit 1
          fi
          push_output=$(helm push "${package}" oci://quay.io/kubernaut-ai)
          printf '%s\n' "${push_output}"
          digest=$(printf '%s\n' "${push_output}" | sed -n 's/^Digest: //p')
          test -n "${digest}"

          skopeo copy --retry-times 3 \
            "docker://${CHART_REPOSITORY}:${CHART_REGISTRY_VERSION}" \
            "docker://${CHART_REPOSITORY}:latest"
          latest_digest=$(skopeo inspect --raw "docker://${CHART_REPOSITORY}:latest" | \
            python3 -c 'import hashlib, sys; data=sys.stdin.buffer.read(); data=data[:-1] if data.endswith(b"\n") else data; print("sha256:" + hashlib.sha256(data).hexdigest())')
          test "${latest_digest}" = "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Write OCI release manifest
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          export SOURCE_SHA
          SOURCE_SHA=$(git rev-parse HEAD)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["CHART_VERSION"]
          digest = os.environ["DIGEST"]
          manifest = {
              "schema": "kubernaut-development-dependencies-oci/v1",
              "intended_use": "internal-ci-and-upstream-demo-infrastructure",
              "production_supported": False,
              "chart": {
                  "name": "kubernaut-development-dependencies",
                  "version": version,
                  "version_ref": f"oci://quay.io/kubernaut-ai/kubernaut-development-dependencies:{os.environ['CHART_REGISTRY_VERSION']}",
                  "latest_ref": "oci://quay.io/kubernaut-ai/kubernaut-development-dependencies:latest",
                  "digest_ref": f"oci://quay.io/kubernaut-ai/kubernaut-development-dependencies@{digest}",
                  "digest": digest,
              },
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "ref": os.environ["SOURCE_REF"],
                  "sha": os.environ["SOURCE_SHA"],
              },
              "workflow": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          }
          Path("kubernaut-development-dependencies-oci.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          {
            echo "### Development dependencies chart"
            echo "- Immutable version: \`oci://${CHART_REPOSITORY}:${CHART_VERSION}\`"
            echo "- Mutable convenience alias: \`oci://${CHART_REPOSITORY}:latest\`"
            echo "- Digest reference: \`oci://${CHART_REPOSITORY}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload OCI manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: kubernaut-development-dependencies-${{ github.run_number }}
          path: kubernaut-development-dependencies-oci.json
          if-no-files-found: error
