name: Release

# Triggered by version tag push (e.g., v1.4.0, v1.5.0-rc1)
# Builds multi-arch operator image (amd64 + arm64), creates manifest list,
# builds and pushes the OLM bundle image, and creates a GitHub Release.
# Pre-release tags (-rc*, -alpha*, -beta*) create a pre-release and skip :latest tagging.
#
# Prerequisites:
#   - Quay.io robot account with push access to kubernaut-ai org
#   - GitHub Actions secrets: QUAY_ROBOT_USERNAME, QUAY_ROBOT_TOKEN

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE_REGISTRY: quay.io/kubernaut-ai
  IMAGE_NAME: kubernaut-operator

jobs:
  # ========================================
  # STAGE 0: PREPARE
  # ========================================

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_date: ${{ steps.version.outputs.build_date }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -(rc|alpha|beta) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release: $TAG (version: $VERSION)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release: $TAG (version: $VERSION)"
          fi

  # ========================================
  # STAGE 0b: UPSTREAM COMPATIBILITY GATE
  #
  # Upstream publishes and qualifies the full Kubernaut RC first. This job
  # consumes only the immutable qualification evidence; it never checks out
  # upstream source, pulls upstream application images, or invokes upstream CI.
  # The image build jobs depend on this gate, so an unqualified operator SHA
  # cannot publish an operator image.
  # ========================================

  qualification:
    name: Verify upstream compatibility qualification
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download upstream qualification manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/jordigilh/kubernaut/releases/download/${TAG}/operator-compatibility-qualification.json"
          echo "Downloading immutable upstream qualification evidence for ${TAG}"
          curl --fail --location --retry 3 --silent --show-error \
            "$URL" -o upstream-qualification.json
          test -s upstream-qualification.json

      - name: Verify qualification matches this operator tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          OPERATOR_SHA: ${{ github.sha }}
        run: |
          ./hack/verify-release-qualification.sh \
            --manifest upstream-qualification.json \
            --operator-sha "$OPERATOR_SHA" \
            --expected-upstream-ref "refs/tags/${TAG}"

      - name: Retain qualification evidence for the operator release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: upstream-qualification-${{ needs.prepare.outputs.tag }}
          path: upstream-qualification.json
          if-no-files-found: error
          retention-days: 30

  # ========================================
  # STAGE 0c: OPERATOR-LOCAL RELEASE GATES
  #
  # These checks remain deliberately independent of the upstream qualification
  # gate. They prove the tagged operator itself is buildable and testable
  # before the post-test contract image is built.
  # ========================================

  operator-gates:
    name: Verify operator release gates
    needs: [prepare, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          HELM_VERSION=v3.17.3
          HELM_ARCHIVE="/tmp/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "${HELM_ARCHIVE}"
          printf '%s  %s\n' \
            ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd \
            "${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${HELM_ARCHIVE}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Run Go lint gate
        run: make lint

      - name: Run unit, integration, security, and pyramid gates
        run: make test

      - name: Run hack script tests
        run: make test-hack-scripts

      - name: Verify generated manifests are clean
        run: git diff --exit-code -- api config

      - name: Shellcheck hack/ scripts
        run: shellcheck hack/migrate-llm-profile.sh hack/migrate-llm-profile.test.sh hack/validate-security-traceability.sh hack/test-helm-openshift.sh hack/verify-helm-chart.sh hack/verify-test-pyramid.sh hack/verify-ci-boundary.sh hack/verify-ci-boundary.test.sh hack/verify-release-qualification.sh hack/verify-release-qualification.test.sh

  # ========================================
  # STAGE 0d: POST-TEST CONTRACT IMAGE
  #
  # Build the exact operator image consumed by the release contract E2E. The
  # publish jobs below still produce architecture-specific release images, but
  # the E2E gate must not rebuild a different operator image in its runner.
  # ========================================

  operator-e2e-image:
    name: Build operator image for contract E2E
    needs: [prepare, qualification, operator-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build contract E2E operator image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          IMAGE: localhost/kubernaut-operator:ci
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            -t "${IMAGE}" .
          docker save "${IMAGE}" --output operator-e2e-image.tar
          sha256sum operator-e2e-image.tar > operator-e2e-image.tar.sha256

      - name: Upload contract E2E operator image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: operator-e2e-image-${{ needs.prepare.outputs.version }}
          path: |
            operator-e2e-image.tar
            operator-e2e-image.tar.sha256
          retention-days: 1

  # ========================================
  # STAGE 0e: CONTRACT E2E GATE
  # ========================================

  operator-e2e:
    name: Run contract-only Kind E2E
    needs: [prepare, qualification, operator-e2e-image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned Kind, kubectl, and Helm
        run: |
          set -euo pipefail
          KIND_VERSION=v0.31.0
          KUBECTL_VERSION=v1.35.0
          HELM_VERSION=v3.17.3
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          printf '%s  /tmp/kind\n' \
            eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa | sha256sum -c -
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          printf '%s  /tmp/kubectl\n' \
            a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989 | sha256sum -c -
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version
          kubectl version --client
          helm version --short

      - name: Download contract E2E operator image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: operator-e2e-image-${{ needs.prepare.outputs.version }}

      - name: Load contract E2E operator image
        run: |
          set -euo pipefail
          sha256sum --check operator-e2e-image.tar.sha256
          docker load --input operator-e2e-image.tar

      - name: Pull pinned dependency images
        run: |
          docker pull docker.io/library/postgres:16.4
          docker pull docker.io/valkey/valkey:8.0.2

      - name: Run contract-only Kind gate
        env:
          KIND_OPERATOR_VERSION: ci
          KUBERNAUT_OPERATOR_IMAGE: localhost/kubernaut-operator:ci
          KUBERNAUT_E2E_PROVIDER: generic
          KUBERNAUT_E2E_TLS_SOURCE: development
          KIND_CLUSTER_NAME: kubernaut-kind-release
        run: make test-e2e-kind

  # ========================================
  # STAGE 1a: BUILD & PUSH amd64 IMAGE
  # Standard podman build using the multi-stage Dockerfile.
  # ========================================

  build-amd64:
    name: Build Operator (amd64)
    needs: [prepare, qualification, operator-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
          echo "Building ${IMAGE}..."
          podman build \
            --platform linux/amd64 \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            -t "${IMAGE}" .

      - name: Push image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

      # #93: pushed digest, required as input to the SLSA3 provenance
      # generator job below -- re-pulling to inspect (rather than parsing
      # `podman push` output) matches the digest-resolution approach the
      # pre-#93 provenance job already used successfully.
      - name: Resolve pushed digest
        id: digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          podman pull "${IMAGE}:${VERSION}-amd64"
          DIGEST=$(podman inspect --format='{{.Digest}}' "${IMAGE}:${VERSION}-amd64")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ========================================
  # SBOM (amd64 image) + Cosign SBOM attestation
  # ========================================

  sbom:
    name: Generate SBOM and attest
    needs: [prepare, build-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Quay.io (podman)
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Login to Quay.io (docker credentials)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
          syft packages "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" -o cyclonedx-json > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: sbom-${{ needs.prepare.outputs.version }}
          path: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"

  # ========================================
  # STAGE 1b: BUILD & PUSH arm64 IMAGE
  # Cross-compiles the Go binary natively on the amd64 runner (no QEMU),
  # then packages it with Dockerfile.runtime.
  # ========================================

  build-arm64:
    name: Build Operator (arm64)
    needs: [prepare, qualification, operator-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile binary (native, no QEMU)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          echo "Cross-compiling manager for arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT}" \
            -o manager-arm64 cmd/main.go
          ls -lh manager-arm64

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build runtime image (no QEMU)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          echo "Building ${IMAGE}..."
          podman build \
            --platform linux/arm64 \
            -f Dockerfile.runtime \
            --build-arg BINARY=manager-arm64 \
            -t "${IMAGE}" .

      - name: Push image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

      # #93: see the matching step in build-amd64 for why this re-pulls
      # rather than parsing `podman push` output.
      - name: Resolve pushed digest
        id: digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          podman pull "${IMAGE}:${VERSION}-arm64"
          DIGEST=$(podman inspect --format='{{.Digest}}' "${IMAGE}:${VERSION}-arm64")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ========================================
  # STAGE 2: MULTI-ARCH MANIFESTS
  # Creates a manifest list so a single tag (e.g., 1.4.0) resolves
  # to the correct architecture automatically.
  # Also tags :latest for GA releases.
  # ========================================

  create-manifests:
    name: Create Multi-Arch Manifests
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      amd64_digest: ${{ needs.build-amd64.outputs.digest }}
      arm64_digest: ${{ needs.build-arm64.outputs.digest }}
      manifest_digest: ${{ steps.manifest-digest.outputs.digest }}
    steps:
      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Create and push version manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          MANIFEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          echo "Creating manifest ${MANIFEST}..."
          podman manifest rm "${MANIFEST}" 2>/dev/null || true
          podman manifest create "${MANIFEST}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          podman manifest push "${MANIFEST}" "docker://${MANIFEST}"
          echo "Pushed ${MANIFEST}"

      - name: Tag as latest
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LATEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          echo "Tagging ${LATEST}..."
          podman manifest rm "${LATEST}" 2>/dev/null || true
          podman manifest create "${LATEST}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          podman manifest push "${LATEST}" "docker://${LATEST}"
          echo "Pushed ${LATEST}"

      - name: Resolve published manifest digest
        id: manifest-digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          podman pull "${MANIFEST}"
          DIGEST=$(podman inspect --format='{{.Digest}}' "${MANIFEST}")
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${DIGEST}"

  # ========================================
  # Cosign sign multi-arch manifest (keyless)
  # ========================================

  sign:
    name: Sign container images
    needs: [prepare, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Sign version manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign sign --yes "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"

      - name: Sign latest manifest
        if: needs.prepare.outputs.is_prerelease == 'false'
        run: |
          cosign sign --yes "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Verify signature
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/jordigilh/kubernaut-operator/.github/workflows/release.yml@refs/tags/" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"

  # ========================================
  # SLSA Build Level 3 provenance (per-arch digest)
  #
  # #93: upgraded from actions/attest-build-provenance (SLSA Build L1-2)
  # to slsa-framework/slsa-github-generator's container workflow (SLSA
  # Build L3). The difference is the trust boundary, not the build steps
  # themselves (this generator attests an already-built/pushed digest;
  # it does not build the image -- only slsa-github-generator's
  # ecosystem-specific *builders*, e.g. its Go builder, do that):
  #
  # - Before: the "Attest amd64/arm64 provenance" steps ran as part of
  #   *this* repo's own workflow, so the provenance's builder identity
  #   was self-asserted (release.yml attesting to its own build).
  # - After: the provenance job below is a *reusable workflow call*
  #   (`uses:`, not a step), so GitHub mints its OIDC token against the
  #   *generator's* job, not ours. The resulting provenance's builder.id
  #   is slsa-github-generator's own pinned identity
  #   (.../generator_container_slsa3.yml@refs/tags/v2.1.0) -- this repo
  #   can only supply `image`/`digest` as inputs, it cannot forge or
  #   influence the attestation's builder identity or signing material.
  #
  # Must be pinned by an exact release tag (@vX.Y.Z); referencing it by a
  # shorter tag or by commit hash fails at run time -- an open upstream
  # limitation, not a mistake here: GitHub's OIDC token for a reusable
  # workflow call only reliably reports the ref it was invoked at, so
  # slsa-verifier can't yet confirm an arbitrary hash maps to a trusted
  # release (see https://github.com/slsa-framework/slsa-verifier/issues/12).
  #
  # `packages: write` is required even though we push to Quay, not
  # ghcr.io -- an acknowledged upstream quirk of how the generator's
  # reusable-workflow permissions and Cosign credential resolution
  # interact (see slsa-github-generator#1257).
  # ========================================

  provenance-amd64:
    name: SLSA3 provenance (amd64)
    needs: build-amd64
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ${{ needs.build-amd64.outputs.image }}
      digest: ${{ needs.build-amd64.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      registry-password: ${{ secrets.QUAY_ROBOT_TOKEN }}

  provenance-arm64:
    name: SLSA3 provenance (arm64)
    needs: build-arm64
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ${{ needs.build-arm64.outputs.image }}
      digest: ${{ needs.build-arm64.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      registry-password: ${{ secrets.QUAY_ROBOT_TOKEN }}

  # ========================================
  # STAGE 3: OLM BUNDLE IMAGE
  # Builds and pushes the operator bundle image used by OLM / OperatorHub.
  # The bundle version matches the release version.
  # ========================================

  bundle:
    name: Build & Push OLM Bundle
    needs: [prepare, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Regenerate bundle with release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          export IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          make bundle

      - name: Build bundle image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BUNDLE_IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}-bundle:v${VERSION}"
          echo "Building bundle image ${BUNDLE_IMG}..."
          podman build -f bundle.Dockerfile -t "${BUNDLE_IMG}" .

      - name: Push bundle image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BUNDLE_IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}-bundle:v${VERSION}"
          echo "Pushing ${BUNDLE_IMG}..."
          podman push "${BUNDLE_IMG}"

  # ========================================
  # STAGE 3b: OLM CATALOG IMAGE
  # Builds a file-based catalog (FBC) containing the bundle and pushes it.
  # This catalog can be referenced by a CatalogSource on OCP clusters.
  # ========================================

  catalog:
    name: Build & Push OLM Catalog
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build and push catalog image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BUNDLE_IMGS="${IMAGE_REGISTRY}/${IMAGE_NAME}-bundle:v${VERSION}" \
            CATALOG_IMG="${IMAGE_REGISTRY}/${IMAGE_NAME}-catalog:v${VERSION}" \
            CONTAINER_TOOL=podman \
            make catalog-build catalog-push

  # ========================================
  # STAGE 4: GITHUB RELEASE
  # Creates a GitHub Release with auto-generated notes.
  # ========================================

  release:
    name: Create GitHub Release
    needs: [prepare, qualification, operator-e2e, create-manifests, bundle, catalog, sbom, sign, provenance-amd64, provenance-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: sbom-${{ needs.prepare.outputs.version }}
          path: .

      - name: Download upstream qualification evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: upstream-qualification-${{ needs.prepare.outputs.tag }}
          path: qualification

      - name: Create operator release provenance manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OPERATOR_SHA: ${{ github.sha }}
          AMD64_DIGEST: ${{ needs.create-manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.create-manifests.outputs.arm64_digest }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
          QUALIFICATION_URL: https://github.com/jordigilh/kubernaut/releases/download/${{ needs.prepare.outputs.tag }}/operator-compatibility-qualification.json
        run: |
          set -euo pipefail
          test -n "$AMD64_DIGEST"
          test -n "$ARM64_DIGEST"
          test -n "$MANIFEST_DIGEST"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          qualification_path = Path("qualification/upstream-qualification.json")
          with qualification_path.open(encoding="utf-8") as qualification_file:
              qualification = json.load(qualification_file)

          registry = os.environ["IMAGE_REGISTRY"]
          image = f"{registry}/kubernaut-operator"
          manifest = {
              "schema": "kubernaut-operator-release-provenance/v1",
              "operator": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "tag": os.environ["TAG"],
                  "sha": os.environ["OPERATOR_SHA"],
                  "images": {
                      "amd64": f"{image}@{os.environ['AMD64_DIGEST']}",
                      "arm64": f"{image}@{os.environ['ARM64_DIGEST']}",
                      "manifest": f"{image}@{os.environ['MANIFEST_DIGEST']}",
                  },
              },
              "upstream_qualification": qualification,
              "qualification_manifest_url": os.environ["QUALIFICATION_URL"],
              "release_workflow": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          }
          Path("operator-release-provenance.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" sbom.cdx.json operator-release-provenance.json \
            --title "Kubernaut Operator ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            --notes-start-tag "$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')" || \
          gh release create "${TAG}" sbom.cdx.json operator-release-provenance.json \
            --title "Kubernaut Operator ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}

          echo ""
          echo "Release created: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo ""
          echo "Images:"
          echo "  Operator: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          echo "  Bundle:   ${IMAGE_REGISTRY}/${IMAGE_NAME}-bundle:v${VERSION}"
