name: Release

# Triggered by version tag push (e.g., v1.4.0, v1.5.0-rc1)
# Builds multi-arch operator image (amd64 + arm64), creates manifest list,
# publishes the operator image and Helm charts, and creates a GitHub Release.
# Pre-release tags (-rc*, -alpha*, -beta*) create a pre-release and skip :latest tagging.
#
# Prerequisites:
#   - Quay.io production robot account with push access to kubernaut-ai org
#   - Quay.io staging robot account with push access to kubernaut-cicd org
#   - GitHub Actions secrets: QUAY_ROBOT_USERNAME, QUAY_ROBOT_TOKEN
#   - GitHub Actions secrets: QUAY_CICD_ROBOT_USERNAME, QUAY_CICD_ROBOT_TOKEN

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE_REGISTRY: quay.io/kubernaut-ai
  STAGING_IMAGE_REGISTRY: quay.io/kubernaut-cicd
  IMAGE_NAME: kubernaut-operator-image

jobs:
  # ========================================
  # STAGE 0: PREPARE
  # ========================================

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_date: ${{ steps.version.outputs.build_date }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -(rc|alpha|beta) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release: $TAG (version: $VERSION)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release: $TAG (version: $VERSION)"
          fi

  # ========================================
  # STAGE 0b: MANUAL UPSTREAM COMPATIBILITY BOUNDARY
  #
  # Full Kubernaut application compatibility qualification is an external,
  # release-owner-controlled operation. This workflow does not fetch or require
  # an upstream qualification asset; it publishes only after the operator-local
  # release gates and contract E2E pass.
  # ========================================

  # ========================================
  # STAGE 0c: OPERATOR-LOCAL RELEASE GATES
  #
  # These checks prove the tagged operator itself is buildable and testable
  # before the architecture-specific release images are built. Full application compatibility
  # remains a manual release-owner responsibility outside this workflow.
  # ========================================

  operator-lint:
    name: Verify operator lint
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Go lint gate
        run: make lint
      - name: Shellcheck executable hack/ scripts
        run: shellcheck hack/migrate-llm-profile.sh hack/migrate-llm-profile.test.sh hack/verify-helm-chart.sh hack/verify-release-qualification.sh hack/verify-release-qualification.test.sh

  operator-unit:
    name: Run operator unit tests
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run unit gate
        run: make test-unit

  operator-integration:
    name: Run operator integration tests
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration gate
        run: make test-integration

  operator-helm:
    name: Run operator Helm tests
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned Helm 4
        run: |
          set -euo pipefail
          HELM_VERSION=v4.3.0
          HELM_ARCHIVE="/tmp/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "${HELM_ARCHIVE}"
          printf '%s  %s\n' \
            86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb \
            "${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${HELM_ARCHIVE}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: Run Helm chart gate
        run: make test-helm

  operator-hack:
    name: Run operator hack-script tests
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run hack script tests
        run: make test-hack-scripts

  operator-manifests:
    name: Verify generated operator manifests
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify generated manifests are clean
        run: |
          set -euo pipefail
          make manifests generate build-installer
          git diff --exit-code -- api config charts/kubernaut-operator/files dist

  # ========================================
  # STAGE 0d: CONTRACT E2E GATE
  # ========================================

  operator-e2e:
    name: Run contract-only Kind E2E
    needs: [prepare, build-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KIND_CLUSTER_NAME: kubernaut-kind-release
    permissions:
      contents: read
    steps:
      - name: Checkout operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned Kind, kubectl, and Helm 4
        run: |
          set -euo pipefail
          KIND_VERSION=v0.31.0
          KUBECTL_VERSION=v1.35.0
          HELM_VERSION=v4.3.0
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          printf '%s  /tmp/kind\n' \
            eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa | sha256sum -c -
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          printf '%s  /tmp/kubectl\n' \
            a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989 | sha256sum -c -
          HELM_ARCHIVE="/tmp/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "${HELM_ARCHIVE}"
          printf '%s  %s\n' \
            86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb \
            "${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${HELM_ARCHIVE}" -C /tmp
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version
          kubectl version --client
          helm version --short

      - name: Login to Quay.io
        env:
          QUAY_CICD_ROBOT_USERNAME: ${{ secrets.QUAY_CICD_ROBOT_USERNAME }}
          QUAY_CICD_ROBOT_TOKEN: ${{ secrets.QUAY_CICD_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${QUAY_CICD_ROBOT_TOKEN}" | docker login quay.io \
            --username "${QUAY_CICD_ROBOT_USERNAME}" \
            --password-stdin

      - name: Pull amd64 release image by digest
        id: pull-amd64
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
        run: |
          set -euo pipefail
          REMOTE_IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}@${AMD64_DIGEST}"
          LOCAL_IMAGE="localhost/kubernaut-operator:${VERSION}-amd64"
          test -n "${AMD64_DIGEST}"
          docker pull "${REMOTE_IMAGE}"
          IMAGE_ID=$(docker image inspect --format='{{.Id}}' "${REMOTE_IMAGE}")
          docker tag "${IMAGE_ID}" "${LOCAL_IMAGE}"
          echo "image=${LOCAL_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Pulled ${REMOTE_IMAGE} and tagged local Kind image ${LOCAL_IMAGE}"

      - name: Pull pinned dependency images
        run: |
          docker pull docker.io/library/postgres:16.4
          docker pull docker.io/valkey/valkey:8.0.2

      - name: Run contract-only Kind gate
        id: contract-e2e
        env:
          KIND_OPERATOR_VERSION: ${{ needs.prepare.outputs.version }}-amd64
          KUBERNAUT_OPERATOR_IMAGE: ${{ steps.pull-amd64.outputs.image }}
          KUBERNAUT_E2E_TLS_SOURCE: certmanager
          KEEP_CLUSTER: "1"
        run: make test-e2e-kind

      - name: Collect Kind diagnostics
        if: ${{ failure() && steps.contract-e2e.outcome == 'failure' }}
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/operator-e2e-diagnostics.txt"
          # The nested shell intentionally expands inherited runtime variables.
          # shellcheck disable=SC2016
          timeout 180s bash -c '
            KUBECTL=(kubectl --request-timeout=10s --context "kind-${KIND_CLUSTER_NAME}")
            {
              echo "=== cluster ==="
              "${KUBECTL[@]}" cluster-info
              echo "=== nodes ==="
              "${KUBECTL[@]}" get nodes -o wide
              echo "=== pods ==="
              "${KUBECTL[@]}" get pods -A -o wide
              echo "=== deployments ==="
              "${KUBECTL[@]}" get deployments -A
              echo "=== events ==="
              "${KUBECTL[@]}" get events -A --sort-by=.lastTimestamp
              echo "=== operator deployment ==="
              "${KUBECTL[@]}" describe deployment \
                kubernaut-operator-controller-manager \
                -n kubernaut-operator-system
              echo "=== pod descriptions ==="
              "${KUBECTL[@]}" describe pods -A
              echo "=== pod logs ==="
              while read -r namespace pod; do
                test -n "${namespace}" || continue
                test -n "${pod}" || continue
                echo "--- ${namespace}/${pod} ---"
                "${KUBECTL[@]}" logs \
                  --namespace "${namespace}" "${pod}" \
                  --all-containers=true --prefix --tail=200
                "${KUBECTL[@]}" logs \
                  --namespace "${namespace}" "${pod}" \
                  --all-containers=true --prefix --tail=200 --previous
              done < <(
                "${KUBECTL[@]}" get pods -A \
                  -o custom-columns="NAMESPACE:.metadata.namespace,NAME:.metadata.name" \
                  --no-headers
              )
            }
          ' 2>&1 | tee "${diagnostics}" || true
          timeout 120s kind export logs "${RUNNER_TEMP}/kind-logs" --name "${KIND_CLUSTER_NAME}" || true

      - name: Upload Kind diagnostics
        if: ${{ failure() && steps.contract-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: operator-release-kind-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operator-e2e-diagnostics.txt
            ${{ runner.temp }}/kind-logs
          if-no-files-found: warn

      - name: Delete retained Kind cluster
        if: always()
        run: timeout 120s kind delete cluster --name "${KIND_CLUSTER_NAME}" || true

  # ========================================
  # STAGE 1a: BUILD & PUSH amd64 IMAGE
  # Standard podman build using the multi-stage Dockerfile.
  # ========================================

  build-amd64:
    name: Build Operator (amd64)
    needs: [prepare, operator-lint, operator-unit, operator-integration, operator-helm, operator-hack, operator-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Quay.io
        run: |
          set -euo pipefail
          STAGING_AUTHFILE="${RUNNER_TEMP}/quay-staging-auth.json"
          printf '%s' "${{ secrets.QUAY_CICD_ROBOT_TOKEN }}" | podman login \
            --authfile "${STAGING_AUTHFILE}" \
            --username "${{ secrets.QUAY_CICD_ROBOT_USERNAME }}" \
            --password-stdin quay.io
          echo "STAGING_AUTHFILE=${STAGING_AUTHFILE}" >> "${GITHUB_ENV}"
          echo "REGISTRY_AUTH_FILE=${STAGING_AUTHFILE}" >> "${GITHUB_ENV}"

      - name: Build image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
          echo "Building ${IMAGE}..."
          podman build \
            --platform linux/amd64 \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            -t "${IMAGE}" .

      - name: Push image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

      - name: Install Skopeo for registry digest resolution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version

      # #93: pushed digest, required as input to the SLSA3 provenance
      # generator job below -- re-pulling to inspect (rather than parsing
      # `podman push` output) matches the digest-resolution approach the
      # pre-#93 provenance job already used successfully.
      - name: Resolve pushed digest
        id: digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}"
          DIGEST=$(skopeo inspect --authfile "${STAGING_AUTHFILE}" \
            --format='{{.Digest}}' "docker://${IMAGE}:${VERSION}-amd64")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ========================================
  # STAGE 1b: BUILD & PUSH arm64 IMAGE
  # Cross-compiles the Go binary natively on the amd64 runner (no QEMU),
  # then packages it with Dockerfile.runtime.
  # ========================================

  build-arm64:
    name: Build Operator (arm64)
    needs: [prepare, operator-lint, operator-unit, operator-integration, operator-helm, operator-hack, operator-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile binary (native, no QEMU)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          echo "Cross-compiling manager for arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT}" \
            -o manager-arm64 cmd/main.go
          ls -lh manager-arm64

      - name: Login to Quay.io
        run: |
          set -euo pipefail
          STAGING_AUTHFILE="${RUNNER_TEMP}/quay-staging-auth.json"
          printf '%s' "${{ secrets.QUAY_CICD_ROBOT_TOKEN }}" | podman login \
            --authfile "${STAGING_AUTHFILE}" \
            --username "${{ secrets.QUAY_CICD_ROBOT_USERNAME }}" \
            --password-stdin quay.io
          echo "STAGING_AUTHFILE=${STAGING_AUTHFILE}" >> "${GITHUB_ENV}"
          echo "REGISTRY_AUTH_FILE=${STAGING_AUTHFILE}" >> "${GITHUB_ENV}"

      - name: Build runtime image (no QEMU)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          echo "Building ${IMAGE}..."
          podman build \
            --platform linux/arm64 \
            -f Dockerfile.runtime \
            --build-arg BINARY=manager-arm64 \
            -t "${IMAGE}" .

      - name: Push image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

      - name: Install Skopeo for registry digest resolution
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version

      # #93: see the matching step in build-amd64 for why this re-pulls
      # rather than parsing `podman push` output.
      - name: Resolve pushed digest
        id: digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}"
          DIGEST=$(skopeo inspect --authfile "${STAGING_AUTHFILE}" \
            --format='{{.Digest}}' "docker://${IMAGE}:${VERSION}-arm64")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ========================================
  # STAGE 1c: PROMOTE TESTED IMAGES
  # Copy the exact tested architecture images from the staging Quay namespace
  # into the production namespace. The digest check prevents a retag or push
  # conversion from silently changing the tested image content.
  # ========================================

  promote-images:
    name: Promote tested images to production Quay
    needs: [prepare, build-amd64, build-arm64, operator-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Login to staging Quay
        env:
          QUAY_CICD_ROBOT_USERNAME: ${{ secrets.QUAY_CICD_ROBOT_USERNAME }}
          QUAY_CICD_ROBOT_TOKEN: ${{ secrets.QUAY_CICD_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          STAGING_AUTHFILE="${RUNNER_TEMP}/quay-staging-auth.json"
          printf '%s' "${QUAY_CICD_ROBOT_TOKEN}" | podman login \
            --authfile "${STAGING_AUTHFILE}" \
            --username "${QUAY_CICD_ROBOT_USERNAME}" \
            --password-stdin quay.io
          echo "STAGING_AUTHFILE=${STAGING_AUTHFILE}" >> "${GITHUB_ENV}"

      - name: Login to production Quay
        env:
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          PRODUCTION_AUTHFILE="${RUNNER_TEMP}/quay-production-auth.json"
          printf '%s' "${QUAY_ROBOT_TOKEN}" | podman login \
            --authfile "${PRODUCTION_AUTHFILE}" \
            --username "${QUAY_ROBOT_USERNAME}" \
            --password-stdin quay.io
          echo "PRODUCTION_AUTHFILE=${PRODUCTION_AUTHFILE}" >> "${GITHUB_ENV}"

      - name: Install Skopeo for staging digest verification
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version

      - name: Promote amd64 and arm64 images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          EXPECTED_ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail

          promote() {
            local arch="$1"
            local expected_digest="$2"
            local staging_image="${STAGING_IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-${arch}"
            local staging_digest_ref="${staging_image%:*}@${expected_digest}"
            local production_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-${arch}"

            actual_digest=$(skopeo inspect --authfile "${STAGING_AUTHFILE}" \
              --format='{{.Digest}}' "docker://${staging_image}")
            test "${actual_digest}" = "${expected_digest}"
            REGISTRY_AUTH_FILE="${STAGING_AUTHFILE}" podman pull "${staging_digest_ref}"
            podman tag "${staging_digest_ref}" "${production_image}"
            REGISTRY_AUTH_FILE="${PRODUCTION_AUTHFILE}" podman push "${production_image}"
            echo "promoted ${arch}: ${actual_digest}"
          }

          promote amd64 "${EXPECTED_AMD64_DIGEST}"
          promote arm64 "${EXPECTED_ARM64_DIGEST}"

  # ========================================
  # STAGE 2: MULTI-ARCH MANIFESTS
  # Creates a manifest list so a single tag (e.g., 1.4.0) resolves
  # to the correct architecture automatically.
  # Also tags :latest for GA releases.
  # ========================================

  create-manifests:
    name: Create Multi-Arch Manifests
    needs: [prepare, build-amd64, build-arm64, operator-e2e, promote-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      amd64_digest: ${{ steps.manifest-digest.outputs.amd64_digest }}
      arm64_digest: ${{ steps.manifest-digest.outputs.arm64_digest }}
      manifest_digest: ${{ steps.manifest-digest.outputs.digest }}
    steps:
      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Create and push version manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          MANIFEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          echo "Creating manifest ${MANIFEST}..."
          podman manifest rm "${MANIFEST}" 2>/dev/null || true
          podman manifest create "${MANIFEST}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          podman manifest push "${MANIFEST}" "docker://${MANIFEST}"
          echo "Pushed ${MANIFEST}"

      - name: Tag as latest
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LATEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          echo "Tagging ${LATEST}..."
          podman manifest rm "${LATEST}" 2>/dev/null || true
          podman manifest create "${LATEST}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64"
          podman manifest push "${LATEST}" "docker://${LATEST}"
          echo "Pushed ${LATEST}"

      - name: Install Skopeo for registry inspection
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version

      - name: Resolve published manifest digest
        id: manifest-digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          EXPECTED_ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          MANIFEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          AMD64_DIGEST=$(skopeo inspect --format='{{.Digest}}' "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-amd64")
          ARM64_DIGEST=$(skopeo inspect --format='{{.Digest}}' "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}-arm64")
          DIGEST=$(skopeo inspect --format='{{.Digest}}' "docker://${MANIFEST}")
          test "${AMD64_DIGEST}" = "${EXPECTED_AMD64_DIGEST}"
          test "${ARM64_DIGEST}" = "${EXPECTED_ARM64_DIGEST}"
          test "${DIGEST}" != "${AMD64_DIGEST}"
          test "${DIGEST}" != "${ARM64_DIGEST}"
          test -n "${DIGEST}"
          {
            echo "amd64_digest=${AMD64_DIGEST}"
            echo "arm64_digest=${ARM64_DIGEST}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "amd64 digest: ${AMD64_DIGEST}"
          echo "arm64 digest: ${ARM64_DIGEST}"
          echo "top-level manifest digest: ${DIGEST}"

  # ========================================
  # SBOM coverage and Cosign SBOM attestations
  # Runs only after the final registry manifest has been created. The single
  # job records SBOMs for both architecture images and the final manifest.
  # ========================================

  sbom:
    name: Generate SBOMs and attest
    needs: [prepare, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.0.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate architecture and manifest SBOMs
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ needs.create-manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.create-manifests.outputs.arm64_digest }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          test -n "${AMD64_DIGEST}"
          test -n "${ARM64_DIGEST}"
          test -n "${MANIFEST_DIGEST}"
          syft packages "${IMAGE}@${AMD64_DIGEST}" -o cyclonedx-json > sbom-amd64.cdx.json
          syft packages "${IMAGE}@${ARM64_DIGEST}" -o cyclonedx-json > sbom-arm64.cdx.json
          syft packages "${IMAGE}@${MANIFEST_DIGEST}" -o cyclonedx-json > sbom-manifest.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: sbom-${{ needs.prepare.outputs.version }}
          path: sbom-*.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest architecture and manifest SBOMs
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ needs.create-manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.create-manifests.outputs.arm64_digest }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate sbom-amd64.cdx.json "${IMAGE}@${AMD64_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom-arm64.cdx.json "${IMAGE}@${ARM64_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom-manifest.cdx.json "${IMAGE}@${MANIFEST_DIGEST}"

  # ========================================
  # Cosign sign multi-arch manifest (keyless)
  # ========================================

  sign:
    name: Sign container images
    needs: [prepare, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.0.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Sign version manifest
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ needs.create-manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.create-manifests.outputs.arm64_digest }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${AMD64_DIGEST}"
          cosign sign --yes "${IMAGE}@${ARM64_DIGEST}"
          cosign sign --yes "${IMAGE}@${MANIFEST_DIGEST}"

      - name: Sign latest manifest
        if: needs.prepare.outputs.is_prerelease == 'false'
        run: |
          cosign sign --yes "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Verify manifest signature
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="^https://github.com/jordigilh/kubernaut-operator/.github/workflows/release.yml@refs/tags/" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"

  # ========================================
  # SLSA Build Level 3 provenance (final multi-arch manifest digest)
  #
  # #93: upgraded from actions/attest-build-provenance (SLSA Build L1-2)
  # to slsa-framework/slsa-github-generator's container workflow (SLSA
  # Build L3). The difference is the trust boundary, not the build steps
  # themselves (this generator attests an already-built/pushed digest;
  # it does not build the image -- only slsa-github-generator's
  # ecosystem-specific *builders*, e.g. its Go builder, do that):
  #
  # - Before: the attestation steps ran as part of *this* repo's own workflow,
  #   so the provenance's builder identity was self-asserted (release.yml
  #   attesting to its own build).
  # - After: the final multi-arch manifest is attested by a *reusable workflow call*
  #   (`uses:`, not a step), so GitHub mints its OIDC token against the
  #   *generator's* job, not ours. The resulting provenance's builder.id
  #   is slsa-github-generator's own pinned identity
  #   (.../generator_container_slsa3.yml@refs/tags/v2.1.0) -- this repo
  #   can only supply `image`/`digest` as inputs, it cannot forge or
  #   influence the attestation's builder identity or signing material.
  #
  # Must be pinned by an exact release tag (@vX.Y.Z); referencing it by a
  # shorter tag or by commit hash fails at run time -- an open upstream
  # limitation, not a mistake here: GitHub's OIDC token for a reusable
  # workflow call only reliably reports the ref it was invoked at, so
  # slsa-verifier can't yet confirm an arbitrary hash maps to a trusted
  # release (see https://github.com/slsa-framework/slsa-verifier/issues/12).
  #
  # `packages: write` is required even though we push to Quay, not
  # ghcr.io -- an acknowledged upstream quirk of how the generator's
  # reusable-workflow permissions and Cosign credential resolution
  # interact (see slsa-github-generator#1257).
  # ========================================

  provenance:
    name: SLSA3 provenance (multi-arch manifest)
    needs: create-manifests
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # exact release tag required by the generator
    with:
      image: quay.io/kubernaut-ai/kubernaut-operator-image
      digest: ${{ needs.create-manifests.outputs.manifest_digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_ROBOT_USERNAME }}
      registry-password: ${{ secrets.QUAY_ROBOT_TOKEN }}

  # ========================================
  # STAGE 3: OPERATOR HELM CHART
  # Packages and publishes the operator chart after all release artifacts,
  # security attestations, and provenance have completed.
  # ========================================

  operator-chart:
    name: Package & Push Operator Helm Chart
    needs: [prepare, operator-e2e, create-manifests, sbom, sign, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chart_version: ${{ steps.package.outputs.chart_version }}
      chart_digest: ${{ steps.push.outputs.chart_digest }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Helm 4
        run: |
          set -euo pipefail
          HELM_VERSION=v4.3.0
          HELM_ARCHIVE="/tmp/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "${HELM_ARCHIVE}"
          printf '%s  %s\n' \
            86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb \
            "${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${HELM_ARCHIVE}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Package operator chart with released image digest
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          test -n "${MANIFEST_DIGEST}"
          chart_dir="${RUNNER_TEMP}/kubernaut-operator"
          mkdir -p dist
          cp -R charts/kubernaut-operator "${chart_dir}"
          sed -i "0,/^  tag: /s/^  tag: .*/  tag: ${VERSION}/" "${chart_dir}/values.yaml"
          sed -i "0,/^  digest: /s/^  digest: .*/  digest: ${MANIFEST_DIGEST}/" "${chart_dir}/values.yaml"
          helm lint "${chart_dir}"
          helm package "${chart_dir}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          chart="dist/kubernaut-operator-${VERSION}.tgz"
          test -s "${chart}"
          test "$(helm show chart "${chart}" | awk '$1 == "version:" {print $2; exit}')" = "${VERSION}"
          test "$(helm show chart "${chart}" | awk '$1 == "appVersion:" {print $2; exit}')" = "${VERSION}"
          test "$(helm show values "${chart}" | awk '$1 == "tag:" {print $2; exit}')" = "${VERSION}"
          test "$(helm show values "${chart}" | awk '$1 == "digest:" {print $2; exit}')" = "${MANIFEST_DIGEST}"
          echo "chart_version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Login to Quay.io
        env:
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${QUAY_ROBOT_TOKEN}" | helm registry login quay.io \
            --username "${QUAY_ROBOT_USERNAME}" \
            --password-stdin

      - name: Push operator chart
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          chart="dist/kubernaut-operator-${VERSION}.tgz"
          push_output=$(helm push "${chart}" oci://quay.io/kubernaut-ai)
          printf '%s\n' "${push_output}"
          digest=$(printf '%s\n' "${push_output}" | sed -n 's/^Digest: //p')
          test -n "${digest}"
          echo "chart_digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Operator Helm chart"
            echo "- Version: \`${VERSION}\`"
            echo "- Immutable OCI reference: \`oci://quay.io/kubernaut-ai/kubernaut-operator@${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ========================================
  # STAGE 4: GITHUB RELEASE
  # Creates a GitHub Release with auto-generated notes.
  # ========================================

  release:
    name: Create GitHub Release
    needs: [prepare, operator-e2e, create-manifests, operator-chart, sbom, sign, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: sbom-${{ needs.prepare.outputs.version }}
          path: .

      - name: Create operator release provenance manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OPERATOR_SHA: ${{ github.sha }}
          AMD64_DIGEST: ${{ needs.create-manifests.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.create-manifests.outputs.arm64_digest }}
          MANIFEST_DIGEST: ${{ needs.create-manifests.outputs.manifest_digest }}
          OPERATOR_CHART_VERSION: ${{ needs.operator-chart.outputs.chart_version }}
          OPERATOR_CHART_DIGEST: ${{ needs.operator-chart.outputs.chart_digest }}
        run: |
          set -euo pipefail
          test -n "$AMD64_DIGEST"
          test -n "$ARM64_DIGEST"
          test -n "$MANIFEST_DIGEST"
          test -n "$OPERATOR_CHART_VERSION"
          test -n "$OPERATOR_CHART_DIGEST"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          registry = os.environ["IMAGE_REGISTRY"]
          image = f"{registry}/{os.environ['IMAGE_NAME']}"
          manifest = {
              "schema": "kubernaut-operator-release-provenance/v2",
              "operator": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "tag": os.environ["TAG"],
                  "sha": os.environ["OPERATOR_SHA"],
                  "images": {
                      "amd64": f"{image}@{os.environ['AMD64_DIGEST']}",
                       "arm64": f"{image}@{os.environ['ARM64_DIGEST']}",
                       "manifest": f"{image}@{os.environ['MANIFEST_DIGEST']}",
                   },
                   "chart": {
                       "name": "kubernaut-operator",
                       "version": os.environ["OPERATOR_CHART_VERSION"],
                       "tag": (
                           "oci://quay.io/kubernaut-ai/"
                           "kubernaut-operator:"
                           + os.environ["OPERATOR_CHART_VERSION"]
                       ),
                       "digest": (
                           "oci://quay.io/kubernaut-ai/"
                           "kubernaut-operator@"
                           + os.environ["OPERATOR_CHART_DIGEST"]
                       ),
                   },
               },
               "upstream_qualification": {
                   "mode": "manual",
                   "automated": False,
                   "responsibility": "release operator",
                   "evidence": "maintained outside this workflow",
               },
              "release_workflow": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          }
          Path("operator-release-provenance.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" sbom-amd64.cdx.json sbom-arm64.cdx.json sbom-manifest.cdx.json operator-release-provenance.json \
            --title "Kubernaut Operator ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            --notes-start-tag "$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')" || \
          gh release create "${TAG}" sbom-amd64.cdx.json sbom-arm64.cdx.json sbom-manifest.cdx.json operator-release-provenance.json \
            --title "Kubernaut Operator ${TAG}" \
            --generate-notes \
            ${PRERELEASE_FLAG}

          echo ""
          echo "Release created: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo ""
          echo "Images:"
          echo "  Operator: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
