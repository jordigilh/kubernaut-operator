name: PR Image Build

# Builds an amd64 operator image on PR to validate the Dockerfile and
# provide a deployable preview image for testing on OCP clusters.
# Image is tagged as: ghcr.io/jordigilh/kubernaut-operator:pr-<number>
#
# Uses GHCR for PR images; Quay.io is reserved for releases only.

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/jordigilh
  IMAGE_NAME: kubernaut-operator

jobs:
  build-image:
    name: Build & Push PR Image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          VERSION="pr-${PR_NUMBER}"
          echo "Building ${IMAGE} (commit: ${GIT_COMMIT:0:8})..."
          podman build \
            --platform linux/amd64 \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg GIT_COMMIT="${GIT_COMMIT}" \
            -t "${IMAGE}" .

      - name: Push image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"
          echo ""
          {
            echo "## Preview image ready"
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo ""
            echo "Deploy with the operator Helm chart:"
            echo '```bash'
            echo "helm install kubernaut-operator ./charts/kubernaut-operator --namespace kubernaut-operator-system --create-namespace --set-string image.repository=${IMAGE%:*} --set-string image.tag=${IMAGE##*:} --wait"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
