name: PR Image Build

# Publish the exact operator image that passed the Tests workflow. This is a
# post-test preview publication; it deliberately does not rebuild the image.
# Images are tagged as: ghcr.io/jordigilh/kubernaut-operator:pr-<number>
#
# workflow_run is used so this workflow can download the artifact created by
# Tests. It only publishes same-repository pull requests because fork tokens do
# not have permission to write packages.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io/jordigilh
  IMAGE_NAME: kubernaut-operator

jobs:
  publish-image:
    name: Publish tested PR image (amd64)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != '' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download tested operator image artifact
        uses: actions/download-artifact@v8
        with:
          name: operator-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load tested operator image
        run: |
          set -euo pipefail
          sha256sum --check operator-image.tar.sha256
          docker load --input operator-image.tar

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push tested PR image
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:pr-${PR_NUMBER}"
          docker tag localhost/kubernaut-operator:ci "${IMAGE}"
          docker push "${IMAGE}"
          {
            echo "## Preview image ready"
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo ''
            echo 'Deploy with:'
            echo '```bash'
            echo "make deploy IMG=${IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
