name: Tests

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  sbom-scan:
    name: SBOM and Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build image
        run: docker build -t kubernaut-operator:ci .

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.20.0

      - name: Generate SBOM
        run: syft packages kubernaut-operator:ci -o cyclonedx-json > sbom.cdx.json

      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.70.0

      - name: Scan image
        run: trivy image --severity CRITICAL,HIGH,MEDIUM --exit-code 1 --ignorefile .trivyignore kubernaut-operator:ci

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Shellcheck hack/ scripts
        run: shellcheck hack/migrate-llm-profile.sh hack/migrate-llm-profile.test.sh

      - name: Run hack/ script tests
        run: make test-hack-scripts

      - name: Check coverage threshold
        run: |
          # cover.out is produced by `make test` (Makefile: -coverprofile cover.out)
          grep 'internal/' cover.out > cover-internal.out || true
          echo "mode: set" | cat - cover-internal.out > cover-internal-final.out
          COVERAGE=$(go tool cover -func=cover-internal-final.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Internal package coverage: ${COVERAGE}%"
          THRESHOLD=80
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Internal coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

  # These jobs intentionally have no `needs` relationship with `test`: each
  # provisions an isolated Kind cluster and runs in parallel with the IT lane.
  kind-generic:
    name: Kind E2E (generic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned Kind and kubectl
        run: |
          set -euo pipefail
          KIND_VERSION=v0.31.0
          KUBECTL_VERSION=v1.35.0
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Run generic Kind E2E
        env:
          KUBERNAUT_E2E_PROVIDER: generic
          KIND_CLUSTER_NAME: kubernaut-kind-generic
        run: make test-e2e-kind

  kind-cilium:
    name: Kind E2E (Cilium)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned Kind, kubectl, and Helm
        run: |
          set -euo pipefail
          KIND_VERSION=v0.31.0
          KUBECTL_VERSION=v1.35.0
          HELM_VERSION=v3.17.3
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version
          kubectl version --client
          helm version

      - name: Run Kind+Cilium E2E
        env:
          KUBERNAUT_E2E_PROVIDER: cilium
          KIND_CLUSTER_NAME: kubernaut-kind-cilium
        run: make test-e2e-kind

  kind-calico:
    name: Kind E2E (Calico)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pinned Kind and kubectl
        run: |
          set -euo pipefail
          KIND_VERSION=v0.31.0
          KUBECTL_VERSION=v1.35.0
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Run Kind+Calico E2E
        env:
          KUBERNAUT_E2E_PROVIDER: calico
          KIND_CLUSTER_NAME: kubernaut-kind-calico
        run: make test-e2e-kind
