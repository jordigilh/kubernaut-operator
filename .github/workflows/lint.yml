name: Lint

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=10m cmd/... api/... internal/... test/...

      - name: Lint Go code (godox TODO/FIXME report -- informational only)
        # godox is deliberately excluded from .golangci.yml's blocking linter
        # set (see the NOTE there): blocking merges on the presence of the
        # word TODO would defeat the purpose of TODO comments as a
        # deferred-work tracking tool. .golangci.yml also scopes godox's
        # keywords to [TODO, FIXME] (dropping the default BUG keyword).
        # continue-on-error keeps this annotation-only -- it never fails the job.
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m --enable-only godox cmd/... api/... internal/... test/...
