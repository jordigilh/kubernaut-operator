name: Retest Command

# Handles the "/retest" slash command dispatched by slash-command-dispatch.yml.
# Re-runs the PR's CI checks (Go Lint, Unit & Integration Tests, PR Image
# Build) against the current head commit -- no empty commit or manual
# Actions-UI click needed.

on:
  repository_dispatch:
    types: [retest-command]

permissions:
  actions: write
  pull-requests: write
  contents: read

jobs:
  retest:
    name: Re-run CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run CI workflows for the PR head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request.number }}
          HEAD_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "PR #${PR_NUMBER} head commit: ${HEAD_SHA}"

          rerun_any=false
          for wf in lint.yml test.yml pr-image.yml; do
            run_id=$(gh run list --repo "$REPO" --workflow "$wf" --limit 20 \
              --json databaseId,headSha \
              -q "[.[] | select(.headSha == \"${HEAD_SHA}\")][0].databaseId")

            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "Re-running ${wf} (run ${run_id})"
              gh run rerun "$run_id" --repo "$REPO" || echo "::warning::rerun failed for ${wf} run ${run_id}"
              rerun_any=true
            else
              echo "No existing run of ${wf} for ${HEAD_SHA}; skipping"
            fi
          done

          if [ "$rerun_any" != "true" ]; then
            echo "::warning::No CI runs found to re-run for ${HEAD_SHA}"
          fi

      - name: Comment acknowledgment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "🔄 Re-running CI checks (Go Lint, Unit & Integration Tests, PR Image Build) for the latest commit."
