# Minimal Kubernaut CR: only the fields the operator actually requires to
# reach Running, everything else relies on defaults. See
# docs/installation/00-quickstart.md for the field-by-field walkthrough, and
# config/samples/v1alpha2_kubernaut.yaml for the fully-annotated, every-knob
# reference sample.
apiVersion: kubernaut.ai/v1alpha2
kind: Kubernaut
metadata:
  labels:
    app.kubernetes.io/name: kubernaut-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubernaut
  namespace: kubernaut-system
spec:
  # BYO PostgreSQL (schema-required parent object + host/secretName; see
  # docs/installation/01-infrastructure.md to provision it).
  postgresql:
    host: postgresql.kubernaut-system.svc.cluster.local
    secretName: postgresql-secret   # keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, db-secrets.yaml

  # BYO Valkey/Redis (schema-required parent object + host/secretName).
  valkey:
    host: valkey.kubernaut-system.svc.cluster.local
    secretName: valkey-secret       # key: valkey-secrets.yaml

  # At least one named LLM profile is schema-required (spec.llmProfiles
  # itself is a mandatory key). provider/model/credentialsSecretName are
  # always required; endpoint is additionally required for provider: openai.
  # claude-sonnet-4-6 is the model validated against this operator's KA/AF
  # integration (see config/samples/v1alpha2_kubernaut.yaml) -- swap in
  # openai/vertex_ai/bedrock/azure once your own provider is validated.
  llmProfiles:
    primary:
      provider: anthropic           # or: openai, vertex_ai, bedrock, azure
      model: claude-sonnet-4-6
      credentialsSecretName: llm-credentials

  # kubernautAgent is a schema-required parent key. Its logical-agent profile
  # references can stay unset here: exactly one profile is defined above, so
  # the operator infers it automatically (v1alpha2/F10). Investigation
  # concurrency defaults to 50 per Agent replica.
  kubernautAgent: {}

  # Both Rego policy ConfigMaps are schema-required (no operator-bundled
  # default, matching the upstream Helm chart's own "fail" guard) -- the
  # ConfigMaps named here must already exist before this CR is applied. See
  # docs/installation/00-quickstart.md for a minimal starter policy for each.
  aiAnalysis:
    policy:
      configMapName: aianalysis-policy
  signalProcessing:
    policy:
      configMapName: signalprocessing-policy

  # Gateway is the only external API enabled by this minimum sample.
  gateway:
    enabled: true

  # API Frontend and Console are optional. Enable AF separately when an OIDC
  # provider and external MCP/A2A access are required.
  apiFrontend:
    enabled: false
