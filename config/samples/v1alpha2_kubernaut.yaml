# Practical Kubernaut CR: required fields only, plus a commented optional
# Fleet/TLS example. For the exact minimum CR, see
# config/samples/v1alpha2_kubernaut_minimal.yaml and
# docs/installation/00-quickstart.md.
apiVersion: kubernaut.ai/v1alpha2
kind: Kubernaut
metadata:
  labels:
    app.kubernetes.io/name: kubernaut-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubernaut
  namespace: kubernaut-system
spec:
  # BYO PostgreSQL. The Secret must contain POSTGRES_USER,
  # POSTGRES_PASSWORD, and POSTGRES_DB.
  postgresql:
    host: postgresql.kubernaut-system.svc.cluster.local
    secretName: postgresql-secret

  # BYO Valkey/Redis. The Secret must contain valkey-secrets.yaml.
  valkey:
    host: valkey.kubernaut-system.svc.cluster.local
    secretName: valkey-secret

  # One named profile is enough; the operator infers it for KA and API
  # Frontend when their profile references are omitted.
  llmProfiles:
    primary:
      provider: anthropic # or openai, vertex_ai, bedrock, azure
      model: claude-sonnet-4-6
      credentialsSecretName: llm-credentials

  # Required parent; the sole LLM profile is inferred for both KA roles.
  kubernautAgent: {}

  # These ConfigMaps must exist before the CR is applied.
  aiAnalysis:
    policy:
      configMapName: aianalysis-policy
  signalProcessing:
    policy:
      configMapName: signalprocessing-policy

  # Gateway is the only external API enabled by this minimum sample.
  gateway:
    enabled: true

  # Generic Kubernetes/Kind TLS. Install cert-manager before applying this CR
  # and pre-create the referenced Issuer/Certificates. Set provisioning.enabled
  # to true when the operator should reconcile those cert-manager objects.
  # tls:
  #   mode: cert-manager
  #   certManager:
  #     issuerRef:
  #       name: kubernaut-ca
  #       kind: Issuer
  #       group: cert-manager.io
  #     internalCASecretName: kubernaut-internal-ca
  #     serviceTLSSecretNames:
  #       gateway: gateway-tls
  #       datastorage: datastorage-tls
  #       kubernautagent: kubernautagent-tls
  #       apifrontend: apifrontend-tls
  #       authwebhook: authwebhook-tls

  # API Frontend and Console are optional. Disable AF here so this sample does
  # not require an external OIDC provider; enable it separately when needed.
  apiFrontend:
    enabled: false

  # Optional Fleet example. Uncomment and replace every placeholder before
  # enabling; omitted Fleet configuration remains disabled and inert.
  # fleet:
  #   enabled: true
  #   mcpGateway:
  #     endpoint: "https://mcp-gateway.example.com/sse"
  #     type: eaigw # or kuadrant
  #     namespace: managed-clusters
  #     tls:
  #       source: secret
  #       caCertSecretRef:
  #         name: mcp-gateway-ca
  #         key: ca.crt
  #   scopeCheck:
  #     backend: fleetmetadatacache
  #   oauth2:
  #     tokenURL: "https://keycloak.example.com/realms/kubernaut/protocol/openid-connect/token"
  #     credentialsSecretRef: fleet-oauth2-creds
