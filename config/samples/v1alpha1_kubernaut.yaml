apiVersion: kubernaut.ai/v1alpha1
kind: Kubernaut
metadata:
  labels:
    app.kubernetes.io/name: kubernaut-operator
    app.kubernetes.io/managed-by: kustomize
  name: kubernaut
  namespace: kubernaut-system
spec:
  image:
    pullPolicy: IfNotPresent

  postgresql:
    host: postgresql.kubernaut-system.svc.cluster.local
    port: 5432
    secretName: postgresql-secret
    sslMode: require

  valkey:
    host: valkey.kubernaut-system.svc.cluster.local
    port: 6379
    secretName: valkey-secret

  # Fleet federation (multi-cluster reads via MCP Gateway, and the
  # optional operator-managed Fleet Metadata Cache service, ADR-068) moved
  # to v1alpha2-only as of the v1alpha2 migration -- see
  # docs/design/ADR-CRD-001-v1alpha2-redesign.md. spec.fleet /
  # spec.fleetMetadataCache / the per-component fleetOAuth2CredentialsSecretRef
  # and mcpGatewayNamespace overrides that used to live here have no
  # v1alpha1 equivalent; configure Fleet via
  # config/samples/v1alpha2_kubernaut.yaml instead.

  # Named LLM profiles, referenced by name from kubernautAgent.llmProfileRef,
  # apiFrontend.llmProfileRef, apiFrontend.severityTriage.llmProfileRef, and
  # kubernautAgent.phaseModels. Profiles referenced from phaseModels (#233)
  # or apiFrontend.severityTriage.llmProfileRef (#234) may use their own
  # provider and credentialsSecretName, independent of the profile they'd
  # otherwise inherit from -- except when severityTriage's and API
  # Frontend's own resolved profile are both vertex_ai, in which case they
  # must still share a credentialsSecretName (API Frontend's Vertex AI
  # client relies on ambient Application Default Credentials rather than
  # per-profile credentials, kubernaut#1731).
  llmProfiles:
    primary:
      provider: vertex_ai
      model: claude-sonnet-4-6
      credentialsSecretName: llm-credentials
      vertexProject: "example-gcp-project"
      vertexLocation: "us-central1"
      maxRetries: 3
      timeoutSeconds: 120
      # Model-aware reasoning/thinking tokens (disabled by default; opt in
      # per profile). BudgetTokens always wins over effort for Anthropic
      # (native or Vertex-hosted Claude, as here) when both are set.
      # effort: "none" combined with enabled: true is rejected for
      # Anthropic-family providers — Anthropic has no "thinking enabled,
      # zero effort" wire state; use enabled: false to disable instead.
      # reasoning:
      #   enabled: true
      #   effort: high   # one of: none, minimal, low, medium, high, xhigh
      #   # budgetTokens: 4096   # exact-value override; wins over effort when set
    lightweight:
      provider: vertex_ai
      model: claude-haiku-4-5
      credentialsSecretName: llm-credentials
      vertexProject: "example-gcp-project"
      vertexLocation: "us-central1"
      # Cheaper/faster reasoning tier for the high-volume phase this
      # profile is swapped into below (kubernautAgent.phaseModels).
      # reasoning:
      #   enabled: true
      #   effort: minimal

  kubernautAgent:
    llmProfileRef: primary
    phaseModels:
      workflow_discovery: lightweight
    logging:
      level: debug
    maxTurns: 40
    audit:
      enabled: true
    interactive:
      enabled: true
      inactivityTimeout: 10m
      maxConcurrentSessions: 10
      rateLimitPerUser: 10
      sessionTTL: 30m
    safety:
      anomaly:
        maxRepeatedFailures: 3
        maxToolCallsPerTool: 10
        maxTotalToolCalls: 40
      sanitization:
        credentialScrubEnabled: true
        injectionPatternsEnabled: true
    summarizer:
      maxToolOutputSize: 100000
      threshold: 8000
    alignmentCheck:
      enabled: false
      maxStepTokens: 500
      timeout: 10s
    session:
      ttl: 30m
    serverRateLimit:
      requestsPerSecond: 50
      burst: 100
    shutdown:
      drainSeconds: 15

  apiFrontend:
    enabled: true
    auth:
      issuerURL: "https://keycloak-keycloak.apps.dev.redhat-internal.com/realms/kagenti"
      audience: "https://keycloak-keycloak.apps.dev.redhat-internal.com/realms/kagenti"
      jwksURL: "http://keycloak-service.keycloak:8080/realms/kagenti/protocol/openid-connect/certs"
      allowInsecureIssuers: true
    logging:
      level: debug
    rateLimit:
      ipRequestsPerSec: 50
      userRequestsPerSec: 20
      toolCallsPerMinute: 60
      maxConcurrentSessions: 100
    route:
      enabled: false
    shutdown:
      drainSeconds: 15
    spire:
      enabled: true
      className: zero-trust-workload-identity-manager-spire
    rbac:
      sarCacheTTL: "30s"
      roleBindings:
        - role: sre
          groups: ["platform-engineering"]
        - role: ai-orchestrator
          groups: ["platform-engineering"]
        - role: cicd
          groups: ["platform-engineering"]
        - role: observability
          groups: ["platform-engineering"]
        - role: l3-audit
          groups: ["platform-engineering"]
        - role: remediation-approver
          groups: ["platform-engineering"]

  gateway:
    enabled: false
    logging:
      level: info
    route:
      enabled: false
    config:
      deduplicationCooldown: 5m
      k8sRequestTimeout: 15s
      cors:
        allowCredentials: false
        maxAge: 300

  dataStorage:
    endpointPropagationDelay: 10s
    logging:
      level: info

  aiAnalysis:
    logging:
      level: info
    policy:
      configMapName: aianalysis-policy

  signalProcessing:
    logging:
      level: info
    policy:
      configMapName: signalprocessing-policy

  remediationOrchestrator:
    dryRun: false
    dryRunHoldPeriod: 1h
    logging:
      level: info
    retention:
      period: 24h
    effectivenessAssessment:
      stabilizationWindow: 2m20s
    notifications:
      notifySelfResolved: false
    timeouts:
      global: 1h
      processing: 5m
      analyzing: 10m
      awaitingApproval: 15m
      executing: 30m
      verifying: 30m
    routing:
      recentlyRemediatedCooldown: 5m
      consecutiveFailureThreshold: 3
      consecutiveFailureCooldown: 1h
      exponentialBackoffBase: 1m
      exponentialBackoffMax: 10m
      exponentialBackoffMaxExponent: 4
      recurrenceCountThreshold: 5
      noActionRequiredDelayHours: 24
      ineffectiveChainThreshold: 3
      ineffectiveTimeWindow: 4h
      scopeBackoffBase: 5s
      scopeBackoffMax: 5m
    asyncPropagation:
      gitOpsSyncDelay: 10s
      operatorReconcileDelay: 1m
      proactiveAlertDelay: 5m

  workflowExecution:
    cooldownPeriod: 1m
    logging:
      level: info
    workflowNamespace: kubernaut-workflows

  effectivenessMonitor:
    logging:
      level: info
    assessment:
      stabilizationWindow: 30s
      validityWindow: 300s

  notification:
    logging:
      level: info
    slack:
      channel: "#kubernaut-alerts"
      secretName: slack-webhook

  authWebhook:
    logging:
      level: info

  networkPolicies:
    enabled: false

  console:
    enabled: true
    auth:
      secretName: kubernaut-console-oidc
    route:
      enabled: true

  ansible:
    enabled: false
