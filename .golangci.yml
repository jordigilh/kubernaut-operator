version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - interfacebloat
    - lll
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # G101: test fixtures set CRD spec fields like CredentialsSecretName /
      # CredentialsSecretRef to short fake strings (e.g. "llm-creds"); these
      # are Secret *reference names*, not credential material.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"
      # G101: mount-path constants (e.g. fleetTokenMountPath) and
      # *TLSSecretName / *SecretName identifiers in these two files are
      # filesystem paths and Secret object names, not credential values.
      - path: "internal/resources/(configmaps|services)\\.go"
        linters:
          - gosec
        text: "G101"
      # G204: test/e2e and test/utils intentionally build kubectl/make
      # subprocess invocations from controlled, test-internal arguments.
      - path: "(^test/|_test\\.go)"
        linters:
          - gosec
        text: "G204"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# Surface every finding per run instead of golangci-lint's default caps
# (max-issues-per-linter: 50, max-same-issues: 3) so incremental linter
# rollout doesn't hide additional occurrences behind repeated re-runs.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
