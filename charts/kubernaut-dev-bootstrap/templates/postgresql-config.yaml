apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgresql.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-dev-bootstrap.labels" . | nindent 4 }}
data:
  postgresql-ssl.conf: |-
    ssl = on
    ssl_cert_file = '/tmp/bootstrap-tls/tls.crt'
    ssl_key_file = '/tmp/bootstrap-tls/tls.key'
    hba_file = '/tmp/bootstrap-config/pg_hba.conf'
  pg_hba.conf: |-
    local all all trust
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::0/0 reject
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::0/0 scram-sha-256
