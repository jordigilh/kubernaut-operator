apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.valkey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-dev-bootstrap.labels" . | nindent 4 }}
type: Opaque
stringData:
  valkey-secrets.yaml: |-
    password: {{ .Values.valkey.password | quote }}
  VALKEY_PASSWORD: {{ .Values.valkey.password | quote }}
