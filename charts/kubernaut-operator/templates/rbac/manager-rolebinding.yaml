apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernaut-operator-manager-rolebinding
  labels:
    {{- include "kubernaut-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernaut-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernaut-operator.serviceAccountName" . }}
    namespace: {{ include "kubernaut-operator.namespace" . }}
