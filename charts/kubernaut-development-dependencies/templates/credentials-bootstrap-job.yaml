{{- $credentialsName := include "kubernaut-development-dependencies.credentialsName" . -}}
{{- $credentialsImage := include "kubernaut-development-dependencies.image" (dict "image" .Values.credentials.image) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "kubernaut-development-dependencies.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials-bootstrap
    spec:
      serviceAccountName: {{ $credentialsName }}
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: credentials-bootstrap
          image: {{ $credentialsImage | quote }}
          imagePullPolicy: {{ .Values.credentials.image.pullPolicy }}
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              random_value() {
                openssl rand -hex "$1"
              }

              ensure_owned_or_absent() {
                name="$1"
                if ! kubectl get secret "$name" -n "$POD_NAMESPACE" >/dev/null 2>&1; then
                  return 0
                fi
                managed_by="$(kubectl get secret "$name" -n "$POD_NAMESPACE" -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}' || true)"
                instance="$(kubectl get secret "$name" -n "$POD_NAMESPACE" -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/instance}' || true)"
                if [ "$managed_by" != "Helm" ] || [ "$instance" != "$RELEASE_NAME" ]; then
                  echo "refusing to adopt Secret $name owned outside this Helm release" >&2
                  exit 1
                fi
                return 1
              }

              label_owned() {
                kubectl label secret "$1" -n "$POD_NAMESPACE" \
                  app.kubernetes.io/managed-by=Helm \
                  "app.kubernetes.io/instance=$RELEASE_NAME" \
                  app.kubernetes.io/part-of=kubernaut-development-dependencies \
                  --overwrite >/dev/null
              }

              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT

              if ensure_owned_or_absent "$POSTGRES_SECRET_NAME"; then
                postgres_user="$(random_value 16)"
                postgres_password="$(random_value 32)"
                printf 'username: %s\npassword: %s\n' "$postgres_user" "$postgres_password" > "$tmpdir/db-secrets.yaml"
                kubectl create secret generic "$POSTGRES_SECRET_NAME" -n "$POD_NAMESPACE" \
                  --from-literal=POSTGRES_USER="$postgres_user" \
                  --from-literal=POSTGRES_PASSWORD="$postgres_password" \
                  --from-literal=POSTGRES_DB="$POSTGRES_DATABASE" \
                  --from-file=db-secrets.yaml="$tmpdir/db-secrets.yaml"
                label_owned "$POSTGRES_SECRET_NAME"
              fi

              if ensure_owned_or_absent "$VALKEY_SECRET_NAME"; then
                valkey_password="$(random_value 32)"
                printf 'password: %s\n' "$valkey_password" > "$tmpdir/valkey-secrets.yaml"
                kubectl create secret generic "$VALKEY_SECRET_NAME" -n "$POD_NAMESPACE" \
                  --from-file=valkey-secrets.yaml="$tmpdir/valkey-secrets.yaml"
                label_owned "$VALKEY_SECRET_NAME"
              fi
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: POSTGRES_SECRET_NAME
              value: {{ .Values.postgresql.secretName | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgresql.database | quote }}
            - name: VALKEY_SECRET_NAME
              value: {{ .Values.valkey.secretName | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-cleanup" $credentialsName | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "kubernaut-development-dependencies.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials-cleanup
    spec:
      serviceAccountName: {{ $credentialsName }}
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      containers:
        - name: credentials-cleanup
          image: {{ $credentialsImage | quote }}
          imagePullPolicy: {{ .Values.credentials.image.pullPolicy }}
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              delete_owned() {
                name="$1"
                if ! kubectl get secret "$name" -n "$POD_NAMESPACE" >/dev/null 2>&1; then
                  return 0
                fi
                managed_by="$(kubectl get secret "$name" -n "$POD_NAMESPACE" -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/managed-by}' || true)"
                instance="$(kubectl get secret "$name" -n "$POD_NAMESPACE" -o 'jsonpath={.metadata.labels.app\.kubernetes\.io/instance}' || true)"
                if [ "$managed_by" != "Helm" ] || [ "$instance" != "$RELEASE_NAME" ]; then
                  echo "refusing to delete Secret $name owned outside this Helm release" >&2
                  exit 1
                fi
                kubectl delete secret "$name" -n "$POD_NAMESPACE" --ignore-not-found
              }

              delete_owned "$POSTGRES_SECRET_NAME"
              delete_owned "$VALKEY_SECRET_NAME"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: POSTGRES_SECRET_NAME
              value: {{ .Values.postgresql.secretName | quote }}
            - name: VALKEY_SECRET_NAME
              value: {{ .Values.valkey.secretName | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
