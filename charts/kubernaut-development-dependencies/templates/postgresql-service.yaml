apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.postgresql.name }}
    app.kubernetes.io/part-of: kubernaut-development-dependencies
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
