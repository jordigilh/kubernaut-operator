{{- if .Values.fixtures.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
type: Opaque
stringData:
  api_key: {{ .Values.fixtures.llm.apiKey | quote }}
  api-key: {{ .Values.fixtures.llm.apiKey | quote }}
  credentials.json: {{ .Values.fixtures.llm.apiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-url: {{ .Values.fixtures.slack.webhookURL | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-routing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
data:
  routing.yaml: |-
    route:
      receiver: slack-ops
    receivers:
      - name: slack-ops
        slackConfigs:
          - channel: "#kubernaut-alerts"
            credentialRef: slack-ops
      - name: teams-primary
        teamsConfigs:
          - credentialRef: teams-primary
      - name: pagerduty-critical
        pagerdutyConfigs:
          - credentialRef: pagerduty-critical
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-teams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-url: {{ .Values.fixtures.teams.webhookURL | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-pagerduty
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
type: Opaque
stringData:
  routing-key: {{ .Values.fixtures.pagerduty.routingKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernaut-console-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.fixtures.console.clientID | quote }}
  client-secret: {{ .Values.fixtures.console.clientSecret | quote }}
  cookie-secret: {{ .Values.fixtures.console.cookieSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aianalysis-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
data:
  approval.rego: |-
    {{- .Values.fixtures.policies.aiAnalysis | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signalprocessing-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
data:
  policy.rego: |-
    {{- .Values.fixtures.policies.signalProcessing | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernaut-development-dependencies-contract
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
data:
  connection-contract.yaml: |-
    # Apply these values to a Kubernaut CR in this namespace.
    postgresql:
      host: {{ printf "%s.%s.svc.cluster.local" .Values.postgresql.serviceName .Release.Namespace | quote }}
      port: 5432
      secretName: {{ .Values.postgresql.secretName | quote }}
      sslMode: {{ .Values.postgresql.sslMode | quote }}
    valkey:
      host: {{ printf "%s.%s.svc.cluster.local" .Values.valkey.serviceName .Release.Namespace | quote }}
      port: 6379
      secretName: {{ .Values.valkey.secretName | quote }}
{{- end }}
