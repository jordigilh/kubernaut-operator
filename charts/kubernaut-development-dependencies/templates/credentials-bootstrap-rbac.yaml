{{- $credentialsName := include "kubernaut-development-dependencies.credentialsName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.postgresql.secretName | quote }}
      - {{ .Values.valkey.secretName | quote }}
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $credentialsName }}
subjects:
  - kind: ServiceAccount
    name: {{ $credentialsName }}
    namespace: {{ .Release.Namespace }}
