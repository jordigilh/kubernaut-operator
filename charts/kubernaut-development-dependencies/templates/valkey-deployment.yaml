apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.valkey.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.valkey.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubernaut-development-dependencies.valkeyLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubernaut-development-dependencies.valkeyLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.valkey.name }}
          image: {{ include "kubernaut-development-dependencies.image" (dict "image" .Values.valkey.image) | quote }}
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command: ["sh", "-ceu"]
          args:
            - exec valkey-server --port 0 --tls-port 6379 --tls-cert-file /certs/tls.crt --tls-key-file /certs/tls.key --tls-ca-cert-file /etc/tls-ca/ca.crt --tls-auth-clients yes --save "" --appendonly no
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -ceu
                - valkey-cli --tls --cacert /etc/tls-ca/ca.crt --cert /certs/tls.crt --key /certs/tls.key -p 6379 ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -ceu
                - valkey-cli --tls --cacert /etc/tls-ca/ca.crt --cert /certs/tls.crt --key /certs/tls.key -p 6379 ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          {{- if .Values.valkey.securityContext.enabled }}
          securityContext:
            {{- include "kubernaut-development-dependencies.containerSecurityContext" .Values.valkey.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: valkey-tls
              mountPath: /certs
              readOnly: true
            - name: valkey-ca
              mountPath: /etc/tls-ca
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.valkey.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.valkey.name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: valkey-tls
          secret:
            secretName: {{ .Values.valkey.tls.serverSecretName }}
            defaultMode: 0440
        - name: valkey-ca
          secret:
            secretName: {{ .Values.valkey.tls.caSecretName }}
            defaultMode: 0440
