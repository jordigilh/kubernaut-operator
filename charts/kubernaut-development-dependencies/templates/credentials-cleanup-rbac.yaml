{{- $credentialsName := include "kubernaut-development-dependencies.credentialsName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-cleanup
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-cleanup
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.postgresql.secretName | quote }}
      - {{ .Values.valkey.secretName | quote }}
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $credentialsName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-cleanup
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $credentialsName }}
subjects:
  - kind: ServiceAccount
    name: {{ $credentialsName }}
    namespace: {{ .Release.Namespace }}
