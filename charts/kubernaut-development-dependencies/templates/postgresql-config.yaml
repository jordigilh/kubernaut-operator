apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgresql.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut-development-dependencies.labels" . | nindent 4 }}
data:
  postgresql-ssl.conf: |-
    ssl = on
    ssl_cert_file = '/tmp/bootstrap-tls/tls.crt'
    ssl_key_file = '/tmp/bootstrap-tls/tls.key'
    hba_file = '/tmp/bootstrap-config/pg_hba'
  # Keep this key free of the .conf suffix. The RHEL image includes every
  # *.conf file in postgresql-cfg as PostgreSQL configuration; pg_hba records
  # are data for hba_file, not PostgreSQL parameter assignments.
  pg_hba: |-
    local all all trust
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::0/0 reject
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::0/0 scram-sha-256
